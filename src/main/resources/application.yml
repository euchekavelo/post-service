server:
  port: 8081
  servlet:
    context-path: /post-service


springdoc:
  swagger-ui:
    path: /api/docs


spring:
  application:
    name: post-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/posts}
    username: ${DATABASE_USER:postgre_user}
    password: ${DATABASE_PASSWORD:postgre_secret_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false
    database-platform: org.hibernate.dialect.PostgreSQL9Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/social-network}
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/social-network}
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:post-service}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:NN038mYwKmIOpzBe5J3r1ci0URwWW4ZN}
            scope: openid

aws:
  s3:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9100/}
      signer: AWSS3V4SignerType
      access-key: ${MINIO_ACCESS_KEY:DuKqx1MLXds1GPemiHvM}
      secret-key: ${MINIO_SECRET_KEY:JsThoz6gzPhYFRjK0BeJ3GtriKZw22rskZ4nMi0M}
      region: ${MINIO_REGION:ru-center}
      bucket-posts: ${MINIO_BUCKET_NAME:posts}


management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1.0


logging:
  pattern:
    correlation: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"


user-service:
  api:
    root-url: ${USER_SERVICE_API_ROOT_URL:http://localhost:8080/user-service}